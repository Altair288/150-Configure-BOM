specVersion: "4.0"

metadata:
  name: com.company.superbom

type: application

framework:
  name: SAPUI5
  version: "1.152.0"
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.table
    - name: sap.suite.ui.commons
    - name: sap.ui.unified
    - name: sap.uxap
    - name: themelib_sap_horizon

server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: false
        transformModulesToUI5:
          autoConvertAllExtendClasses: true

builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: false
        transformModulesToUI5:
          autoConvertAllExtendClasses: true
